name: Corvex upstream merge

# Weekly (and on demand): find the newest stable Pterodactyl Wings tag that main does not contain
# yet, merge it on a branch, run the tests and open a pull request. Security releases should be
# merged and released within 72 hours (PANEL-DAEMON.md section 12.4).

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - name: Find the newest upstream tag
        id: tag
        run: |
          git remote add upstream https://github.com/pterodactyl/wings.git
          git fetch --quiet --tags upstream
          tag="$(git ls-remote --tags --refs upstream 'v*' | awk -F/ '{print $3}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$tag" HEAD; then
            echo "main already contains $tag"
            echo "new=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code origin "refs/heads/upstream/$tag" >/dev/null; then
            echo "branch upstream/$tag already exists"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.tag.outputs.new == 'true'
        with:
          go-version-file: go.mod
      - name: Merge, test and open a pull request
        if: steps.tag.outputs.new == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "corvex-upstream-bot"
          git config user.email "corvex-upstream-bot@users.noreply.github.com"
          git checkout -b "upstream/$TAG"
          status="merged cleanly"
          if ! git merge --no-edit "$TAG"; then
            status="has merge conflicts (resolve them on this branch; see BRANDING.md)"
            git add -A
            git commit --no-edit -m "Merge upstream $TAG (conflicts to resolve)"
          fi
          tests="passed"
          go test ./... > test.log 2>&1 || tests="FAILED (see the workflow log)"
          tail -50 test.log
          rm -f test.log
          git push origin "upstream/$TAG"
          gh pr create --base main --head "upstream/$TAG" \
            --title "Merge upstream Pterodactyl Wings $TAG" \
            --body "Automated upstream merge. Merge: $status. Go tests: $tests.

          Before merging: check every line in BRANDING.md still applies, run the Corvex contract suite against a build of this branch, then release as ${TAG}-cvx.1."
