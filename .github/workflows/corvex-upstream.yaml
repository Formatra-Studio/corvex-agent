name: Corvex upstream merge

# Weekly (and on demand): find the newest stable Pterodactyl Wings tag that main does not contain yet,
# merge it and test it, then push a branch and open a pull request. Security releases should be merged
# and released within 72 hours (PANEL-DAEMON.md section 12.4).
#
# The merge-and-test job runs upstream code (and the modules it downloads) with a read-only token and no
# stored credentials. Only the publish job can write, and it runs no project code: it pushes the merged
# commits from a git bundle and opens the pull request.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      new: ${{ steps.tag.outputs.new }}
      status: ${{ steps.merge.outputs.status }}
      tests: ${{ steps.test.outputs.tests }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the newest upstream tag
        id: tag
        run: |
          git remote add upstream https://github.com/pterodactyl/wings.git
          git fetch --quiet --tags upstream
          tag="$(git ls-remote --tags --refs upstream 'v*' | awk -F/ '{print $3}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$tag" HEAD; then
            echo "main already contains $tag"
            echo "new=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/upstream/$tag" >/dev/null 2>&1; then
            echo "branch upstream/$tag already exists"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Merge
        id: merge
        if: steps.tag.outputs.new == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "corvex-upstream-bot"
          git config user.email "corvex-upstream-bot@users.noreply.github.com"
          git checkout -b "upstream/$TAG"
          status="merged cleanly"
          if ! git merge --no-edit "$TAG"; then
            status="has merge conflicts (resolve them on this branch; see BRANDING.md)"
            git add -A
            git commit --no-edit -m "Merge upstream $TAG (conflicts to resolve)"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          git bundle create upstream.bundle "origin/main..upstream/$TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.tag.outputs.new == 'true'
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        id: test
        if: steps.tag.outputs.new == 'true'
        run: |
          if go test ./... > test.log 2>&1; then
            echo "tests=passed" >> "$GITHUB_OUTPUT"
          else
            echo "tests=FAILED (see the workflow log)" >> "$GITHUB_OUTPUT"
          fi
          tail -50 test.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.tag.outputs.new == 'true'
        with:
          name: upstream-bundle
          path: upstream.bundle
          if-no-files-found: error

  publish:
    needs: merge
    if: needs.merge.outputs.new == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upstream-bundle
      - name: Push the branch, open a pull request and start CI
        env:
          TAG: ${{ needs.merge.outputs.tag }}
          STATUS: ${{ needs.merge.outputs.status }}
          TESTS: ${{ needs.merge.outputs.tests }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --quiet upstream.bundle "upstream/$TAG:upstream/$TAG"
          git push origin "upstream/$TAG"
          gh pr create --base main --head "upstream/$TAG" \
            --title "Merge upstream Pterodactyl Wings $TAG" \
            --body "Automated upstream merge. Merge: $STATUS. Go tests: $TESTS.

          Before merging: check every line in BRANDING.md still applies, run the Corvex contract suite against a build of this branch, then release as ${TAG}-cvx.1."
          gh workflow run corvex-ci.yaml --ref "upstream/$TAG"
