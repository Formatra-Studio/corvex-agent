name: Corvex release

# Tag v<upstream version>-cvx.<n> (e.g. v1.13.4-cvx.1) on main to release. The build job has no
# secrets. The sign job waits for a reviewer on the "agent-release" environment, which alone holds
# the Ed25519 signing key (AGENT_SIGNING_KEY, a PEM private key). Corvex's node bootstrap checks
# both the SHA-256 and the signature before it installs a binary.

on:
  push:
    tags: ["v*-cvx.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build twice and compare
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/build-release.sh "$version" dist
          scripts/build-release.sh "$version" /tmp/check
          diff dist/SHA256SUMS /tmp/check/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: dist/
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-24.04
    environment: agent-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: dist
      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Sign
        env:
          AGENT_SIGNING_KEY: ${{ secrets.AGENT_SIGNING_KEY }}
        run: |
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$AGENT_SIGNING_KEY" > "$key"
          openssl pkey -in "$key" -pubout -out dist/corvex-agent-signing.pub
          for f in corvex-agent_linux_amd64 corvex-agent_linux_arm64 SHA256SUMS; do
            openssl pkeyutl -sign -rawin -inkey "$key" -in "dist/$f" -out "dist/$f.sig"
            openssl pkeyutl -verify -rawin -pubin -inkey dist/corvex-agent-signing.pub -in "dist/$f" -sigfile "dist/$f.sig"
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Corvex Agent $GITHUB_REF_NAME" \
            --notes "Based on Pterodactyl Wings v$(echo "${GITHUB_REF_NAME#v}" | cut -d- -f1). SHA-256 checksums in SHA256SUMS; Ed25519 signatures in *.sig."
